name: Deploy Task Manager

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-task-manager
  cancel-in-progress: true

env:
  APP_DIR: ${{ secrets.VPS_APP_DIR || '/home/deployer/apps/task-manager' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}

      - name: Test
        run: npm test

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Check AdFlow key on VPS before replacing the app
        run: |
          ssh -i ~/.ssh/id_deploy -p ${{ secrets.VPS_PORT || 22 }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "APP_DIR=$APP_DIR bash -se" <<'REMOTE'
          cd "$APP_DIR"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const envPath = path.join(process.cwd(), '.env.local');
          const DEFAULT_URL = 'https://ads.satmi.in';
          const DEFAULT_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkZmxvdy12cHMiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4MzU4NTI5MSwiZXhwIjoyMDk5MTYxMjkxfQ.PNmYQFpq0Yu7QwCq08JAivVQ9WCS3rWzT09CwPs8xZg';
          const DEFAULT_SERVICE = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkZmxvdy12cHMiLCJyb2xlIjoic2VydmljZV9yb2xlIiwiaWF0IjoxNzgzNTg1MjkxLCJleHAiOjIwOTkxNjEyOTF9.kcaaZgkR7f_65dSnvynjZ22cqdU451Q934r0JwvnU-8';

          const raw = fs.existsSync(envPath) ? fs.readFileSync(envPath, 'utf8') : '';
          const map = new Map();
          const order = [];
          for (const line of raw ? raw.split(/\r?\n/) : []) {
            if (!line || line.trim().startsWith('#') || !line.includes('=')) continue;
            const idx = line.indexOf('=');
            const k = line.slice(0, idx).trim();
            const v = line.slice(idx + 1).trim();
            if (!map.has(k)) order.push(k);
            map.set(k, v);
          }

          const isLegacy = (val = '') =>
            val.includes('qexjnswuvbyjenfrbwvj') ||
            val.includes('InJlZiI6InFleGpuc3d1dmJ5amVuZnJid3Zq');

          let changed = false;
          if (!map.get('NEXT_PUBLIC_SUPABASE_URL') || isLegacy(map.get('NEXT_PUBLIC_SUPABASE_URL'))) {
            map.set('NEXT_PUBLIC_SUPABASE_URL', DEFAULT_URL);
            if (!order.includes('NEXT_PUBLIC_SUPABASE_URL')) order.push('NEXT_PUBLIC_SUPABASE_URL');
            changed = true;
          }
          if (!map.get('NEXT_PUBLIC_SUPABASE_ANON_KEY') || isLegacy(map.get('NEXT_PUBLIC_SUPABASE_ANON_KEY'))) {
            map.set('NEXT_PUBLIC_SUPABASE_ANON_KEY', DEFAULT_ANON);
            if (!order.includes('NEXT_PUBLIC_SUPABASE_ANON_KEY')) order.push('NEXT_PUBLIC_SUPABASE_ANON_KEY');
            changed = true;
          }
          if (!map.get('SUPABASE_SERVICE_ROLE_KEY') || isLegacy(map.get('SUPABASE_SERVICE_ROLE_KEY'))) {
            map.set('SUPABASE_SERVICE_ROLE_KEY', DEFAULT_SERVICE);
            if (!order.includes('SUPABASE_SERVICE_ROLE_KEY')) order.push('SUPABASE_SERVICE_ROLE_KEY');
            changed = true;
          }

          if (changed) {
            const out = order.map((k) => `${k}=${map.get(k)}`).join('\n') + '\n';
            fs.writeFileSync(envPath, out, { mode: 0o600 });
            console.log('Updated .env.local with active AdFlow (ads.satmi.in) keys.');
          }
          NODE
          NODE_ENV=production node <<'NODE'
          const { loadEnvConfig } = require('@next/env');
          loadEnvConfig(process.cwd());
          if (!process.env.SUPABASE_SERVICE_ROLE_KEY?.trim()) {
            console.error('Set SUPABASE_SERVICE_ROLE_KEY in the Task Manager server environment before deploying.');
            process.exit(1);
          }
          NODE
          REMOTE

      - name: Sync build to VPS
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -p ${{ secrets.VPS_PORT || 22 }}"
          TARGET="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          $SSH $TARGET "mkdir -p $APP_DIR/data"
          # public/uploads, data, and .env* live on the server and are never overwritten
          rsync -az --delete -e "$SSH" \
            --exclude 'public/uploads/' \
            --exclude 'data/' \
            --exclude '.env*' --exclude 'node_modules/' \
            .next public package.json package-lock.json next.config.ts ecosystem.config.cjs \
            $TARGET:$APP_DIR/
          # Seed data files only if they do not exist on VPS yet
          rsync -az --ignore-existing -e "$SSH" data/ $TARGET:$APP_DIR/data/

      - name: Install deps and (re)start with PM2
        run: |
          ssh -i ~/.ssh/id_deploy -p ${{ secrets.VPS_PORT || 22 }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "APP_DIR=$APP_DIR bash -se" <<'REMOTE'
          set -e
          cd "${APP_DIR:-/home/deployer/apps/task-manager}"
          mkdir -p data public/uploads
          npm ci --omit=dev
          pm2 startOrReload ecosystem.config.cjs --update-env
          pm2 save
          sleep 3
          curl -fsS -o /dev/null http://127.0.0.1:4000 && echo "App is up on :4000"

          # Configure Nginx reverse proxy for tasks.satmi.in -> http://127.0.0.1:4000
          if ! sudo test -f /etc/letsencrypt/live/tasks.satmi.in/fullchain.pem; then
            sudo tee /etc/nginx/sites-available/tasks.satmi.in >/dev/null <<'NGINX_HTTP'
          server {
              listen 80;
              server_name tasks.satmi.in;
              client_max_body_size 25m;

              location / {
                  proxy_pass http://127.0.0.1:4000;
                  proxy_buffer_size 16k;
                  proxy_buffers 4 16k;
                  proxy_busy_buffers_size 32k;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_cache_bypass $http_upgrade;
              }
          }
          NGINX_HTTP
            sudo ln -sf /etc/nginx/sites-available/tasks.satmi.in /etc/nginx/sites-enabled/tasks.satmi.in
            sudo nginx -t && sudo systemctl reload nginx
            sudo certbot --nginx -d tasks.satmi.in --non-interactive --agree-tos --redirect --register-unsafely-without-email || true
          fi

          if sudo test -f /etc/letsencrypt/live/tasks.satmi.in/fullchain.pem; then
            SSL_CERT="/etc/letsencrypt/live/tasks.satmi.in/fullchain.pem"
            SSL_KEY="/etc/letsencrypt/live/tasks.satmi.in/privkey.pem"
          else
            SSL_CERT="/etc/letsencrypt/live/satmi.in/fullchain.pem"
            SSL_KEY="/etc/letsencrypt/live/satmi.in/privkey.pem"
          fi

          sudo tee /etc/nginx/sites-available/tasks.satmi.in >/dev/null <<'NGINX_SSL'
          server {
              server_name tasks.satmi.in;
              client_max_body_size 25m;

              add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
              add_header X-Frame-Options "DENY" always;
              add_header X-Content-Type-Options "nosniff" always;
              add_header Referrer-Policy "strict-origin-when-cross-origin" always;
              add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
              add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https://ads.satmi.in wss://ads.satmi.in; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

              location / {
                  proxy_pass http://127.0.0.1:4000;
                  proxy_buffer_size 16k;
                  proxy_buffers 4 16k;
                  proxy_busy_buffers_size 32k;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_cache_bypass $http_upgrade;
              }

              listen 443 ssl; # managed by Certbot
              ssl_certificate __SSL_CERT__; # managed by Certbot
              ssl_certificate_key __SSL_KEY__; # managed by Certbot
              include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
              ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
          }
          server {
              if ($host = tasks.satmi.in) {
                  return 301 https://$host$request_uri;
              } # managed by Certbot
              listen 80;
              server_name tasks.satmi.in;
              return 404; # managed by Certbot
          }
          NGINX_SSL
          sudo sed -i "s|__SSL_CERT__|$SSL_CERT|g; s|__SSL_KEY__|$SSL_KEY|g" /etc/nginx/sites-available/tasks.satmi.in
          sudo ln -sf /etc/nginx/sites-available/tasks.satmi.in /etc/nginx/sites-enabled/tasks.satmi.in
          sudo nginx -t && sudo systemctl reload nginx
          echo "Nginx configured and reloaded for tasks.satmi.in (SSL cert: $SSL_CERT)"
          REMOTE
